
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activar administrador | Bingo Eloina</title>
  <meta name="referrer" content="no-referrer">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #fffaf8, #f5dce3);
      font-family: system-ui, sans-serif;
      color: #65142f;
    }
    .card {
      width: min(100%, 480px);
      padding: 32px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 16px 50px #65142f22;
      text-align: center;
    }
    h1 { font-size: 28px; }
    p { line-height: 1.6; }
    a { color: #92284b; font-weight: 800; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔐 Bingo de Eloina</h1>
    <p id="status" role="status">
      Verificando enlace privado…
    </p>
    <p>
      <a href="/bingo-home/">Ir al Bingo público</a>
    </p>
  </main>

  <script>
    (async () => {
      const status = document.getElementById("status");

      const fragment = new URLSearchParams(
        window.location.hash.slice(1)
      );

      const token = fragment.get("token");

      // Remove the secret from the visible address immediately.
      history.replaceState(
        null,
        "",
        window.location.pathname
      );

      if (!token) {
        status.textContent =
          "Falta el token de activación en el enlace.";
        return;
      }

      try {
        const response = await fetch("/api/activate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          cache: "no-store",
          body: JSON.stringify({ token })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "No se pudo activar el administrador."
          );
        }

        status.textContent =
          "Acceso activado. Abriendo panel…";

        window.location.replace(
          data.redirect || "/control-panel/"
        );
      } catch (error) {
        status.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
