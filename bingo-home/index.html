
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#65142f">
  <title>Bingo de Eloina Lobo</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fffaf8, #f5dce3);
      color: #65142f;
      font-family: system-ui, sans-serif;
    }

    [hidden] { display: none !important; }

    .page {
      width: min(1900px, calc(100% - 24px));
      margin: auto;
      padding: 12px 0 24px;
    }

    .heading {
      text-align: center;
      margin-bottom: 16px;
    }

    .heading h1 {
      margin: 5px 0;
      color: #65142f;
      font-size: clamp(30px, 4vw, 64px);
      font-weight: 1000;
    }

    .heading p {
      margin: 0;
      color: #a63d5c;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(200px, .55fr) minmax(0, 2.45fr);
      gap: 14px;
      align-items: start;
    }

    .card {
      min-width: 0;
      padding: 18px;
      border: 1px solid #ecc2cd;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 32px #65142f15;
    }

    .current { text-align: center; }

    .current-label {
      color: #a63d5c;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .current-number {
      display: grid;
      place-items: center;
      min-height: 220px;
      font-size: clamp(90px, 12vw, 195px);
      font-weight: 1000;
      line-height: 1;
    }

    .count {
      padding: 12px;
      border-radius: 12px;
      background: #fbeaf0;
      font-size: 18px;
      font-weight: 900;
    }

    .connection {
      margin-top: 12px;
      color: #835569;
      font-size: 13px;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .letter {
      padding: 12px 4px;
      border-radius: 10px;
      color: white;
      font-size: clamp(38px, 4vw, 65px);
      font-weight: 1000;
      text-align: center;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }

    .ball {
      display: grid;
      place-items: center;
      min-width: 0;
      aspect-ratio: 1;
      border: 2px solid #d5a2b1;
      border-radius: 9px;
      background: white;
      color: #4b0c24;
      font-size: clamp(22px, 2.15vw, 38px);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
    }

    .ball.called {
      background: #65142f;
      color: white;
      border-color: #65142f;
    }

    .ball.latest {
      background: #d13b65;
      color: white;
      border: 3px solid #65142f;
    }

    .celebration {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      pointer-events: none;
      overflow: hidden;
      background: #37081bcc;
      backdrop-filter: blur(5px);
    }

    .scene {
      position: relative;
      width: min(96vw, 950px);
      height: min(96dvh, 900px);
      isolation: isolate;
    }

    .letters {
      position: absolute;
      z-index: 4;
      top: 3%;
      left: 0;
      display: flex;
      justify-content: center;
      gap: clamp(4px, 1vw, 18px);
      width: 100%;
      font-size: clamp(65px, 13vw, 160px);
      font-weight: 1000;
      line-height: 1;
      text-shadow:
        0 6px 0 #fff1f1,
        0 15px 30px #65142f88;
    }

    .letters span {
      display: inline-block;
      opacity: 0;
      color: #92284b;
    }

    .letters span:nth-child(2) { color: #d47691; }
    .letters span:nth-child(3) { color: #70152f; }
    .letters span:nth-child(4) { color: #c95c79; }
    .letters span:nth-child(5) { color: #a52b45; }

    .grandma {
      position: absolute;
      z-index: 2;
      bottom: 7%;
      left: 50%;
      width: auto;
      height: 76%;
      max-width: 94%;
      object-fit: contain;
      transform: translateX(-50%);
      transform-origin: 50% 85%;
      filter: drop-shadow(0 18px 24px #28051588);
    }

    /* Wide GIF: allow its full composition to be visible. */
    .grandma.is-gif {
      width: 94%;
      height: 65%;
      bottom: 14%;
    }

    .sparkles {
      position: absolute;
      z-index: 5;
      top: 38%;
      width: 100%;
      text-align: center;
      font-size: clamp(35px, 7vw, 85px);
      opacity: 0;
    }

    .celebration-name {
      position: absolute;
      z-index: 6;
      bottom: 1%;
      left: 50%;
      width: max-content;
      max-width: 96%;
      margin: 0;
      padding: 12px 24px;
      border: 3px solid #fff1f1;
      border-radius: 50px;
      background: #65142fee;
      color: white;
      font-size: clamp(18px, 3vw, 38px);
      font-weight: 1000;
      text-align: center;
      transform: translateX(-50%);
      box-shadow: 0 8px 24px #28051588;
    }

    .photo-error {
      position: absolute;
      z-index: 7;
      top: 45%;
      left: 50%;
      width: min(90%, 440px);
      padding: 20px;
      border-radius: 16px;
      background: white;
      color: #841b2c;
      text-align: center;
      font-weight: 800;
      transform: translate(-50%, -50%);
    }

    .celebration.active .grandma:not(.is-gif) {
      animation: dance 1.05s ease-in-out infinite;
    }

    .celebration.active .letters span {
      animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both;
    }

    .celebration.active .letters span:nth-child(1) {
      animation-delay: .2s;
    }
    .celebration.active .letters span:nth-child(2) {
      animation-delay: .4s;
    }
    .celebration.active .letters span:nth-child(3) {
      animation-delay: .6s;
    }
    .celebration.active .letters span:nth-child(4) {
      animation-delay: .8s;
    }
    .celebration.active .letters span:nth-child(5) {
      animation-delay: 1s;
    }

    .celebration.active .sparkles {
      animation: sparkle 1.5s ease-in-out 1s infinite alternate;
    }

    @keyframes dance {
      0%, 100% {
        transform: translateX(-50%) rotate(-5deg) translateY(0);
      }
      25% {
        transform: translateX(-48%) rotate(4deg) translateY(-18px);
      }
      50% {
        transform: translateX(-50%) rotate(6deg) translateY(0);
      }
      75% {
        transform: translateX(-52%) rotate(-4deg) translateY(-15px);
      }
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform: translateY(65vh) scale(.45) rotate(-15deg);
      }
      65% {
        opacity: 1;
        transform: translateY(-20px) scale(1.12) rotate(5deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes sparkle {
      from {
        opacity: .3;
        transform: scale(.85) rotate(-8deg);
      }
      to {
        opacity: 1;
        transform: scale(1.15) rotate(8deg);
      }
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .current-number { min-height: 130px; }
    }

    @media (max-width: 600px) {
      .card { padding: 10px; }
      .board { gap: 4px; }
      .numbers { grid-template-columns: repeat(2, 1fr); }
      .ball { font-size: clamp(15px, 3.5vw, 23px); }
      .grandma { height: 70%; }
      .grandma.is-gif { height: 56%; }
      .letters { top: 10%; font-size: 14vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .celebration.active .grandma,
      .celebration.active .letters span,
      .celebration.active .sparkles {
        animation: none !important;
      }
      .celebration.active .letters span { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="heading">
      <p>CELEBRANDO 90 AÑOS DE VIDA</p>
      <h1>Bingo de Eloina Lobo</h1>
    </header>

    <div class="layout">
      <section class="card current">
        <div class="current-label">NÚMERO ACTUAL</div>
        <div id="current" class="current-number">—</div>
        <div id="count" class="count">
          0 anunciados · 75 restantes
        </div>
        <div id="connection" class="connection" role="status">
          Conectando al bingo…
        </div>
      </section>

      <section class="card">
        <div id="board" class="board"></div>
      </section>
    </div>
  </main>

  <section
    id="celebration"
    class="celebration"
    aria-hidden="true"
    hidden
  >
    <div class="scene">
      <div class="letters" aria-hidden="true">
        <span>B</span><span>I</span><span>N</span>
        <span>G</span><span>O</span>
      </div>

      <img
        id="grandma"
        class="grandma"
        src="/assets/eloina.png"
        alt="Eloina Lobo celebrando un Bingo"
      >

      <div class="sparkles" aria-hidden="true">
        ✨ 🎉 💗 ✨ 🎊
      </div>

      <p class="celebration-name">
        🎉 ¡BINGO, Eloina Lobo! 🎉
      </p>

      <div id="photo-error" class="photo-error" hidden>
        No se encontró la imagen de celebración.
      </div>
    </div>
  </section>

  <script type="module">
    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://riyzqsqlbawrpcacwkpt.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpeXpxc3FsYmF3cnBjYWN3a3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NzQ0NjUsImV4cCI6MjEwOTA1MDQ2NX0.4Zw3A78yoC3lAdZdJ0VspmMf_jeHt50ACMv6lbkiKL8";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: { persistSession: false },
        realtime: {
          params: { eventsPerSecond: 10 }
        }
      }
    );

    const $ = (id) => document.getElementById(id);

    const letters = ["B", "I", "N", "G", "O"];
    const colors = [
      "#79203d", "#96304e", "#b44765",
      "#a52b45", "#70152f"
    ];

    const ANIMATIONS = [
      "/assets/eloina.png",
      "/assets/eloina-dancing-with-cats.gif",
      "/assets/eloina2.png",
      "/assets/eloina3.png",
      "/assets/eloina4.png",
      "/assets/eloina5.png"
    ];

    const CELEBRATION_MS = 8500;

    let currentGame = null;
    let celebrationTimer = null;
    let initialized = false;

    function drawBoard(numbers) {
      const board = $("board");
      const called = new Set(numbers);
      const latest = numbers.at(-1);

      board.replaceChildren();

      letters.forEach((letter, index) => {
        const column = document.createElement("div");
        column.className = "column";

        const heading = document.createElement("div");
        heading.className = "letter";
        heading.style.background = colors[index];
        heading.textContent = letter;

        const grid = document.createElement("div");
        grid.className = "numbers";

        for (
          let n = index * 15 + 1;
          n <= (index + 1) * 15;
          n++
        ) {
          const ball = document.createElement("div");
          ball.className = "ball";
          ball.textContent = n;

          if (called.has(n)) ball.classList.add("called");
          if (latest === n) ball.classList.add("latest");

          grid.append(ball);
        }

        column.append(heading, grid);
        board.append(column);
      });
    }

    function hideCelebration() {
      clearTimeout(celebrationTimer);

      const overlay = $("celebration");
      overlay.classList.remove("active");
      overlay.hidden = true;
      overlay.setAttribute("aria-hidden", "true");
    }

    function playCelebration(animationIndex, elapsedMs = 0) {
      const overlay = $("celebration");
      const image = $("grandma");

      const index = Number.isInteger(animationIndex) &&
        animationIndex >= 0 &&
        animationIndex < ANIMATIONS.length
          ? animationIndex
          : 0;

      const path = ANIMATIONS[index];
      const isGif = path.toLowerCase().endsWith(".gif");

      clearTimeout(celebrationTimer);

      overlay.classList.remove("active");
      overlay.hidden = false;
      overlay.setAttribute("aria-hidden", "false");

      image.classList.toggle("is-gif", isGif);
      $("photo-error").hidden = true;

      // Reassign the URL to restart a GIF when it is selected.
      // The fragment changes without requesting a different file.
// Remove the previous image before loading the selected one.
image.removeAttribute("src");

// Force the browser to recognize the image change.
void image.offsetWidth;

// Load the image selected by Supabase.
image.src = path;
      
      void overlay.offsetWidth;
      overlay.classList.add("active");

      celebrationTimer = setTimeout(
        hideCelebration,
        Math.max(0, CELEBRATION_MS - elapsedMs)
      );
    }

    function applyGame(game, allowCelebration = true) {
      if (!game) return;

      if (
        currentGame &&
        Number(game.version) < Number(currentGame.version)
      ) {
        return;
      }

      const oldSequence = currentGame
        ? Number(currentGame.celebration_seq)
        : null;

      const newSequence = Number(game.celebration_seq);
      const animationIndex = Number(
        game.celebration_animation ?? 0
      );

      currentGame = game;

      const numbers = game.called_numbers || [];
      const latest = numbers.at(-1);

      $("current").textContent =
        latest === undefined
          ? "—"
          : `${letters[Math.floor((latest - 1) / 15)]}-${latest}`;

      $("count").textContent =
        `${numbers.length} anunciados · ${75 - numbers.length} restantes`;

      drawBoard(numbers);

      const elapsedMs = Date.now() -
        Date.parse(game.celebration_at);

      if (
        allowCelebration &&
        oldSequence !== null &&
        newSequence > oldSequence &&
        Number.isFinite(elapsedMs) &&
        elapsedMs >= 0 &&
        elapsedMs < CELEBRATION_MS
      ) {
        playCelebration(animationIndex, elapsedMs);
      }
    }

    async function refreshGame() {
      const { data, error } = await supabase
        .from("bingo_game")
        .select("*")
        .eq("id", 1)
        .single();

      if (error) {
        $("connection").textContent =
          "⚠️ No se pudo actualizar. Reintentando…";
        return;
      }

      applyGame(data, initialized);
      initialized = true;
    }

    $("grandma").addEventListener("error", () => {
      $("photo-error").hidden = false;
    });

    $("grandma").addEventListener("load", () => {
      $("photo-error").hidden = true;
    });

    const channel = supabase
      .channel("eloina-public-game")
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "bingo_game",
          filter: "id=eq.1"
        },
        ({ new: game }) => {
          applyGame(game);
        }
      )
      .subscribe((status) => {
        if (status === "SUBSCRIBED") {
          $("connection").textContent =
            "🟢 Bingo en vivo";
          refreshGame();
        } else if (
          status === "CHANNEL_ERROR" ||
          status === "TIMED_OUT"
        ) {
          $("connection").textContent =
            "🟠 Reconectando…";
        }
      });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshGame();
    });

    window.addEventListener("online", refreshGame);

    setInterval(refreshGame, 15000);

    await refreshGame();
  </script>
</body>
</html>
